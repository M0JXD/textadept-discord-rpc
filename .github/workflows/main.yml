name: build
on: push
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: xmake-io/github-action-setup-xmake@v1
    - run: git submodule update --init --recursive
    - run: xmake
      
  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: xmake-io/github-action-setup-xmake@v1
    - run: git submodule update --init --recursive
    - run: xmake

  linux-arm:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
    - uses: xmake-io/github-action-setup-xmake@v1
    - run: git submodule update --init --recursive
    - run: xmake

  macos:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v6
    - uses: xmake-io/github-action-setup-xmake@v1
    - run: git submodule update --init --recursive
    - run: xmake
