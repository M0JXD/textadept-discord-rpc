name: build
on: push
jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: xmake-io/github-action-setup-xmake@v1
    - run: git submodule update --init --recursive
    - run: xmake -y
    - uses: actions/upload-artifact@v4
      with:
        name: windows
        path: build/*
      
  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: xmake-io/github-action-setup-xmake@v1
    - run: git submodule update --init --recursive
    - run: xmake -y
    - uses: actions/upload-artifact@v4
      with:
        name: linux
        path: build/*

  linux-arm:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
    - uses: xmake-io/github-action-setup-xmake@v1
    - run: git submodule update --init --recursive
    - run: xmake -y
    - uses: actions/upload-artifact@v4
      with:
        name: linux-arm
        path: build/*

  macos:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v6
    - uses: xmake-io/github-action-setup-xmake@v1
    - run: git submodule update --init --recursive
    - run: xmake -y
    - uses: actions/upload-artifact@v4
      with:
        name: macos
        path: build/*
